name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  template-quality:
    name: Template Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow docs and template invariants
        run: ./scripts/check-template.sh
